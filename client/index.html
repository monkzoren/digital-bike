<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <meta name="theme-color" content="#04061a" />
  <title>Digital Bike</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Chakra+Petch:ital,wght@0,400;0,500;0,600;0,700;1,400;1,500;1,600;1,700&display=swap" rel="stylesheet" />
  <style>
    /* ==================================================================
       Design tokens — shared with Digital Tennis: deep navy glass panels,
       championship gold accents, coral red for destructive actions.
       ================================================================== */
    :root {
      --gold: #ffd60a;
      --gold-hi: #fff3a0;
      --gold-deep: #f0a400;
      --red: #ff4b33;
      --red-deep: #c62214;
      --green: #43e97b;
      --cyan: #35e0ff;
      --ink: #f4f6ff;
      --dim: #9daee9;
      --dim-2: rgba(157, 174, 233, 0.62);
      --panel-hi: rgba(24, 34, 106, 0.92);
      --panel-lo: rgba(7, 10, 44, 0.96);
      --line: rgba(124, 144, 255, 0.22);
      --line-2: rgba(140, 160, 255, 0.42);
      --r-lg: 18px;
      --r-md: 12px;
      --r-sm: 9px;
      --font: 'Chakra Petch', 'Arial Black', Arial, sans-serif;
      --shadow-card: 0 30px 70px rgba(0, 0, 0, 0.55), inset 0 1px 0 rgba(255, 255, 255, 0.09);
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    .hidden { display: none !important; }
    html, body { height: 100%; color: var(--ink); font-family: var(--font); }
    body {
      display: flex; align-items: center; justify-content: center;
      background:
        radial-gradient(1100px 620px at 50% -8%, rgba(38, 54, 160, 0.5), transparent 65%),
        radial-gradient(900px 520px at 88% 112%, rgba(16, 84, 52, 0.28), transparent 60%),
        linear-gradient(180deg, #070a26 0%, #04061a 55%, #03040f 100%);
    }
    ::selection { background: rgba(255, 214, 10, 0.35); }
    * { scrollbar-width: thin; scrollbar-color: rgba(124, 144, 255, 0.35) transparent; }
    *::-webkit-scrollbar { width: 8px; height: 8px; }
    *::-webkit-scrollbar-thumb { background: rgba(124, 144, 255, 0.35); border-radius: 99px; }
    :focus-visible { outline: 2px solid rgba(255, 214, 10, 0.85); outline-offset: 2px; }
    .gp-focus { outline: 3px solid var(--gold); outline-offset: 3px; box-shadow: 0 0 18px rgba(255, 214, 10, 0.5); }

    #app { position: relative; display: flex; align-items: center; justify-content: center; }
    #stage {
      position: relative;
      width: min(1100px, 96vw, calc(100dvh * 16 / 9));
      aspect-ratio: 16 / 9;
      border-radius: var(--r-lg);
      overflow: hidden;
      box-shadow: 0 0 0 1px rgba(124, 144, 255, 0.28), 0 34px 90px rgba(0, 0, 0, 0.6);
      container-type: size;
    }
    #game-canvas { width: 100%; height: 100%; background: #05070f; display: block; }
    #app:fullscreen { width: 100vw; height: 100vh; background: #000; }
    #app:fullscreen #stage {
      width: min(100vw, calc(100vh * 16 / 9)); max-width: none; border-radius: 0; box-shadow: none;
    }

    /* ---------- shared components ---------- */
    button {
      font-family: var(--font); font-style: italic; font-weight: 700; letter-spacing: 2px;
      text-transform: uppercase; color: var(--ink); cursor: pointer;
      background: linear-gradient(180deg, rgba(40, 56, 170, 0.95), rgba(12, 18, 92, 0.95));
      border: 1px solid var(--line-2); border-radius: var(--r-sm);
      padding: 11px 22px; font-size: 13px;
      box-shadow: 0 8px 22px rgba(0, 0, 0, 0.42), inset 0 1px 0 rgba(255, 255, 255, 0.12);
      transition: transform 0.12s ease, filter 0.12s ease;
    }
    button:hover { transform: translateY(-2px); filter: brightness(1.14); }
    button:active { transform: translateY(1px) scale(0.99); }
    button:disabled { opacity: 0.42; cursor: not-allowed; transform: none; filter: none; }
    button.primary {
      background: linear-gradient(180deg, var(--gold-hi), var(--gold) 45%, var(--gold-deep));
      color: #1a1400; border-color: rgba(255, 214, 10, 0.8);
      box-shadow: 0 10px 26px rgba(255, 170, 0, 0.34), inset 0 1px 0 rgba(255, 255, 255, 0.6);
    }
    button.danger { background: linear-gradient(180deg, var(--red), var(--red-deep)); border-color: rgba(255, 90, 70, 0.7); }
    button.ghost { background: rgba(10, 16, 60, 0.7); }
    .panel {
      background: linear-gradient(180deg, var(--panel-hi), var(--panel-lo));
      border: 1px solid var(--line); border-radius: var(--r-lg);
      box-shadow: var(--shadow-card); padding: 18px 22px;
    }
    .panel-label { color: var(--gold); font-size: 11px; font-style: italic; font-weight: 700; letter-spacing: 4px; }
    .info-pill {
      background: rgba(8, 12, 50, 0.75); border: 1px solid var(--line); border-radius: 999px;
      color: var(--dim); font-size: 11px; font-style: italic; font-weight: 600; letter-spacing: 1px;
      padding: 5px 14px; white-space: nowrap;
    }
    .info-pill .v { color: var(--ink); }
    .divider {
      display: flex; align-items: center; gap: 12px; width: 100%;
      color: var(--gold); font-size: 11px; font-style: italic; font-weight: 700; letter-spacing: 5px;
    }
    .divider::before, .divider::after {
      content: ''; flex: 1; height: 1px; background: linear-gradient(90deg, transparent, var(--line-2));
    }
    .divider::after { background: linear-gradient(90deg, var(--line-2), transparent); }

    /* ---------- screens ---------- */
    .screen {
      position: absolute; inset: 0; display: flex; flex-direction: column;
      align-items: center; justify-content: center; gap: 14px; padding: 22px;
      background: radial-gradient(900px 520px at 50% 0%, rgba(28, 42, 140, 0.5), rgba(4, 6, 26, 0.94) 70%);
      z-index: 6; overflow-y: auto;
    }
    #menu .title {
      font-size: clamp(30px, 6cqw, 62px); font-style: italic; font-weight: 700; letter-spacing: 6px;
      background: linear-gradient(180deg, #fff, var(--gold) 60%, var(--gold-deep));
      -webkit-background-clip: text; background-clip: text; color: transparent;
      filter: drop-shadow(0 6px 16px rgba(255, 170, 0, 0.35));
      line-height: 1;
    }
    #menu .sub { color: var(--dim); font-size: 11px; font-style: italic; letter-spacing: 5px; }
    .mode-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 10px; width: min(720px, 92%); }
    .mode-btn {
      display: grid; justify-items: center; gap: 4px; padding: 14px 10px; border-radius: var(--r-md);
    }
    .mode-ico { font-size: 26px; font-style: normal; filter: drop-shadow(0 3px 4px rgba(0, 0, 0, 0.4)); }
    .mode-name { font-size: 14px; }
    .mode-btn .desc {
      font-size: 9px; font-style: italic; font-weight: 500; letter-spacing: 1px;
      color: rgba(255, 255, 255, 0.72); text-transform: none;
    }
    .row { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; justify-content: center; }
    input[type=text], input[type=password], input[type=email] {
      font-family: var(--font); font-size: 14px; font-weight: 600; letter-spacing: 2px;
      background: rgba(4, 8, 34, 0.9); border: 1px solid var(--line-2); border-radius: var(--r-sm);
      color: var(--ink); padding: 10px 14px; text-transform: uppercase;
    }

    /* account chip + profile card */
    #account-chip {
      position: absolute; top: 14px; right: 16px; display: flex; align-items: center; gap: 8px;
      z-index: 8;
    }
    #account-chip .who {
      background: rgba(8, 12, 50, 0.8); border: 1px solid var(--line); border-radius: 999px;
      padding: 6px 14px; font-size: 11px; font-style: italic; letter-spacing: 2px; color: var(--dim);
      cursor: pointer;
    }
    #account-chip .who b { color: var(--ink); }
    #profile-card { width: min(420px, 92%); display: flex; flex-direction: column; gap: 10px; }
    .xp-bar { height: 8px; border-radius: 99px; background: rgba(6, 10, 40, 0.9); border: 1px solid var(--line); overflow: hidden; }
    .xp-bar > i { display: block; height: 100%; background: linear-gradient(90deg, var(--gold-deep), var(--gold-hi)); }
    .stat-row { display: flex; justify-content: space-between; font-size: 12px; color: var(--dim); letter-spacing: 1px; }
    .stat-row b { color: var(--ink); }

    /* selection cards */
    .card-grid { display: flex; gap: 10px; flex-wrap: wrap; justify-content: center; max-width: 92%; max-height: 40cqh; overflow-y: auto; padding: 4px; align-content: flex-start; }
    #char-grid { max-height: 34cqh; }
    #bike-grid .sel-card, #course-grid .sel-card { padding-bottom: 12px; }
    .sel-card {
      position: relative; width: 116px; padding: 8px 6px 10px; border-radius: var(--r-md);
      background: linear-gradient(180deg, rgba(30, 44, 150, 0.85), rgba(8, 14, 80, 0.9));
      border: 1px solid var(--line-2); cursor: pointer; text-align: center;
      transition: transform 0.12s ease, box-shadow 0.12s ease;
    }
    .sel-card:hover { transform: translateY(-3px); }
    .sel-card.on { border-color: var(--gold); box-shadow: 0 0 0 2px rgba(255, 214, 10, 0.5), 0 10px 26px rgba(255, 170, 0, 0.25); }
    .sel-card.locked { filter: grayscale(0.8) brightness(0.7); }
    .sel-card .nm { font-size: 13px; font-style: italic; font-weight: 700; letter-spacing: 1px; }
    .sel-card .sub { font-size: 8px; letter-spacing: 1px; color: var(--dim); text-transform: uppercase; }
    .sel-card .preview { height: 96px; }
    .sel-card .lockmsg { font-size: 8px; color: var(--gold); letter-spacing: 1px; margin-top: 3px; }
    .pips { display: flex; flex-direction: column; gap: 2px; margin-top: 5px; font-size: 8px; color: var(--dim); }
    .pip-row { display: flex; align-items: center; gap: 3px; justify-content: space-between; }
    .pip-dots { display: flex; gap: 2px; }
    .pip-dots i { width: 6px; height: 6px; border-radius: 2px; background: rgba(255, 255, 255, 0.18); }
    .pip-dots i.on { background: var(--gold); }
    /* An absolutely positioned <canvas> keeps its intrinsic 300×150 unless the
       size is stated outright — inset alone leaves the previews in a corner. */
    #char-canvas { position: absolute; inset: 0; width: 100%; height: 100%; pointer-events: none; z-index: 7; }

    /* ---------- HUD ---------- */
    #hud { position: absolute; inset: 0; pointer-events: none; z-index: 4; font-style: italic; }
    #hud .corner { position: absolute; }
    #pos-plate {
      top: 14px; left: 16px; display: flex; align-items: baseline; gap: 6px;
      background: linear-gradient(180deg, rgba(24, 34, 106, 0.86), rgba(7, 10, 44, 0.9));
      border: 1px solid var(--line-2); border-radius: var(--r-md); padding: 8px 16px;
    }
    #pos-plate .p { font-size: 34px; font-weight: 700; color: var(--gold); line-height: 1; }
    #pos-plate .of { font-size: 13px; color: var(--dim); }
    #clock-plate {
      top: 14px; left: 50%; transform: translateX(-50%); text-align: center;
      background: rgba(7, 10, 44, 0.82); border: 1px solid var(--line); border-radius: var(--r-md);
      padding: 6px 20px;
    }
    #clock-plate .t { font-size: 22px; font-weight: 700; letter-spacing: 2px; }
    #clock-plate .gap { font-size: 11px; color: var(--dim); letter-spacing: 2px; }
    #speed-plate { right: 18px; bottom: 22px; text-align: right; }
    #speed-plate .v { font-size: 46px; font-weight: 700; line-height: 0.9; text-shadow: 0 4px 18px rgba(0, 0, 0, 0.6); }
    #speed-plate .u { font-size: 12px; color: var(--dim); letter-spacing: 4px; }
    #boost-wrap { left: 18px; bottom: 22px; width: 190px; }
    #boost-bar {
      height: 14px; border-radius: 99px; background: rgba(6, 10, 40, 0.85);
      border: 1px solid var(--line-2); overflow: hidden;
    }
    #boost-bar > i { display: block; height: 100%; width: 0; background: linear-gradient(90deg, #0d7bd0, var(--cyan)); transition: width 0.1s linear; }
    #boost-wrap.full #boost-bar { box-shadow: 0 0 16px rgba(53, 224, 255, 0.7); }
    #boost-wrap .lbl { font-size: 9px; letter-spacing: 4px; color: var(--dim); margin-bottom: 3px; }
    #biome-banner {
      top: 88px; left: 50%; transform: translateX(-50%);
      font-size: 13px; letter-spacing: 8px; color: var(--ink); opacity: 0;
      text-shadow: 0 3px 14px rgba(0, 0, 0, 0.7); transition: opacity 0.4s ease;
    }
    #biome-banner.show { opacity: 1; }
    #trick-text {
      top: 40%; left: 50%; transform: translateX(-50%); text-align: center;
      font-size: 30px; font-weight: 700; letter-spacing: 5px; color: var(--cyan);
      text-shadow: 0 0 22px rgba(53, 224, 255, 0.8); opacity: 0; transition: opacity 0.2s ease;
    }
    #trick-text.show { opacity: 1; }
    #countdown {
      position: absolute; inset: 0; display: flex; align-items: center; justify-content: center;
      font-size: 120px; font-weight: 700; color: var(--gold); text-shadow: 0 10px 40px rgba(0, 0, 0, 0.7);
      z-index: 5; pointer-events: none;
    }
    #standings {
      top: 96px; right: 16px; display: flex; flex-direction: column; gap: 3px; min-width: 168px;
    }
    #standings .st-row {
      display: flex; gap: 8px; align-items: baseline; font-size: 11px; letter-spacing: 1px;
      background: rgba(7, 10, 44, 0.7); border: 1px solid var(--line); border-radius: 6px; padding: 3px 9px;
    }
    #standings .st-row.me { border-color: rgba(255, 214, 10, 0.7); color: var(--gold); }
    #standings .st-row .n { color: var(--dim); width: 14px; }
    #standings .st-row .g { margin-left: auto; color: var(--dim); font-size: 10px; }
    #crash-flash { position: absolute; inset: 0; background: rgba(180, 40, 20, 0.35); opacity: 0; transition: opacity 0.2s; z-index: 3; }
    #crash-flash.on { opacity: 1; }
    #nameplates { position: absolute; inset: 0; z-index: 5; pointer-events: none; }
    .nameplate {
      position: absolute; transform: translate(-50%, -100%);
      font-size: 11px; font-style: italic; letter-spacing: 1px; white-space: nowrap;
      background: rgba(6, 10, 40, 0.72); border: 1px solid var(--line); border-radius: 99px; padding: 2px 9px;
    }
    .nameplate .bub {
      display: block; margin-bottom: 4px; background: rgba(255, 255, 255, 0.92); color: #101430;
      border-radius: 8px; padding: 3px 8px; font-size: 11px; font-style: normal;
    }

    /* ---------- lobby / waiting ---------- */
    #waiting .code {
      font-size: 40px; font-weight: 700; letter-spacing: 12px; color: var(--gold);
    }
    #waiting-players { display: flex; flex-direction: column; gap: 6px; width: min(460px, 92%); max-height: 36cqh; overflow-y: auto; }
    .player-chip {
      position: relative; display: flex; align-items: center; gap: 10px;
      background: linear-gradient(180deg, rgba(30, 44, 150, 0.9), rgba(8, 14, 80, 0.9));
      border: 1px solid var(--line-2); border-radius: var(--r-sm);
      font-size: 13px; font-style: italic; font-weight: 600; letter-spacing: 1px; padding: 7px 14px;
    }
    .player-chip .chip-char { font-size: 9px; font-weight: 500; color: var(--dim); letter-spacing: 2px; }
    .player-chip.host { border-color: rgba(255, 214, 10, 0.7); }
    .player-chip.host .chip-name::after { content: ' ★'; color: var(--gold); }
    .player-chip.me { border-color: rgba(67, 233, 123, 0.7); }
    .player-chip .ready-tag { color: #86efac; font-size: 10px; letter-spacing: 2px; }
    .player-chip .pts { margin-left: auto; color: var(--gold); font-size: 13px; }
    .chip-kick {
      margin-left: auto; padding: 0 8px; height: 22px; line-height: 20px;
      font-size: 11px; font-weight: 700; letter-spacing: 0; font-style: normal;
      background: rgba(255, 70, 70, 0.12); border: 1px solid rgba(255, 70, 70, 0.45); border-radius: 999px;
      color: #ff9a9a; box-shadow: none; transform: none;
    }
    #lobby-list { display: flex; flex-direction: column; gap: 6px; width: min(520px, 92%); max-height: 26cqh; overflow-y: auto; }
    .lobby-row {
      display: flex; align-items: center; gap: 10px; font-size: 12px; letter-spacing: 1px;
      background: rgba(10, 16, 62, 0.8); border: 1px solid var(--line); border-radius: var(--r-sm); padding: 7px 12px;
    }
    .lobby-row .sp { margin-left: auto; color: var(--dim); }

    /* ---------- results ---------- */
    #results .board { width: min(560px, 94%); display: flex; flex-direction: column; gap: 5px; max-height: 46cqh; overflow-y: auto; }
    .res-row {
      display: flex; align-items: center; gap: 12px; font-size: 14px; font-style: italic; letter-spacing: 1px;
      background: linear-gradient(90deg, rgba(30, 44, 150, 0.75), rgba(8, 14, 80, 0.75));
      border: 1px solid var(--line); border-radius: var(--r-sm); padding: 8px 14px;
    }
    .res-row.p1 { border-color: var(--gold); background: linear-gradient(90deg, rgba(255, 214, 10, 0.22), rgba(8, 14, 80, 0.8)); }
    .res-row.me { box-shadow: 0 0 0 1px rgba(67, 233, 123, 0.6); }
    .res-row .pl { font-size: 20px; font-weight: 700; color: var(--gold); width: 30px; }
    .res-row .tm { margin-left: auto; color: var(--dim); font-size: 12px; }
    #reveal { display: flex; gap: 16px; flex-wrap: wrap; justify-content: center; }

    /* ---------- modals ---------- */
    .modal {
      position: absolute; inset: 0; z-index: 20; display: flex; align-items: center; justify-content: center;
      background: rgba(3, 5, 20, 0.82); padding: 20px;
    }
    .modal .panel { width: min(430px, 94%); display: flex; flex-direction: column; gap: 12px; align-items: center; }
    .modal .msg { font-size: 12px; color: var(--dim); letter-spacing: 1px; text-align: center; min-height: 16px; }

    /* graphics panel */
    #graphics { position: absolute; top: 0; right: 0; bottom: 0; width: min(320px, 84%); z-index: 21; overflow-y: auto; border-radius: 0; }
    .gfx-row { display: flex; align-items: center; justify-content: space-between; gap: 10px; font-size: 12px; letter-spacing: 1px; padding: 5px 0; }
    .gfx-row .seg { display: flex; gap: 4px; }
    .gfx-row .seg button { padding: 4px 9px; font-size: 10px; letter-spacing: 1px; }
    .gfx-row .seg button.on { background: linear-gradient(180deg, var(--gold-hi), var(--gold-deep)); color: #1a1400; }

    /* ---------- chat ---------- */
    #chat-feed {
      position: absolute; left: 16px; top: 96px; width: 280px; max-height: 34%;
      display: flex; flex-direction: column; gap: 3px; z-index: 5; pointer-events: none; overflow: hidden;
    }
    #chat-feed .line { font-size: 12px; letter-spacing: 1px; text-shadow: 0 2px 6px #000; }
    #chat-feed .line b { color: var(--gold); }
    #chat-input {
      position: absolute; left: 16px; bottom: 64px; width: 300px; z-index: 9; display: none;
    }
    #chat-input.on { display: block; }

    /* ---------- touch ---------- */
    #touch-controls { position: absolute; inset: 0; z-index: 8; display: none; }
    #touch-controls.on { display: block; }
    #touch-stick-zone { position: absolute; left: 0; bottom: 0; width: 50%; height: 70%; }
    #touch-stick {
      position: absolute; width: 28cqmin; height: 28cqmin; border-radius: 50%;
      border: 2px solid rgba(160, 180, 255, 0.4); background: rgba(10, 16, 60, 0.3); display: none;
    }
    #touch-knob {
      position: absolute; width: 12cqmin; height: 12cqmin; border-radius: 50%;
      background: rgba(200, 215, 255, 0.6); left: 50%; top: 50%; transform: translate(-50%, -50%);
    }
    #touch-actions { position: absolute; right: 3cqmin; bottom: 4cqmin; display: flex; gap: 2cqmin; align-items: flex-end; }
    .touch-btn {
      width: 15cqmin; height: 15cqmin; border-radius: 50%; font-size: 3cqmin; letter-spacing: 1px;
      background: rgba(30, 44, 150, 0.72); border: 2px solid var(--line-2);
      display: flex; align-items: center; justify-content: center;
    }
    .touch-btn.hop { background: rgba(255, 214, 10, 0.3); }
    .touch-btn.boost { background: rgba(53, 224, 255, 0.28); }

    #toast {
      position: absolute; left: 50%; bottom: 15%; transform: translateX(-50%);
      background: rgba(6, 10, 40, 0.92); border: 1px solid var(--line-2); border-radius: 99px;
      padding: 9px 22px; font-size: 12px; font-style: italic; letter-spacing: 2px; z-index: 25;
      opacity: 0; transition: opacity 0.25s ease; pointer-events: none; text-align: center;
    }
    #toast.on { opacity: 1; }
    #corner-btns { position: absolute; right: 12px; top: 12px; display: flex; gap: 6px; z-index: 9; }
    #corner-btns button { padding: 6px 10px; font-size: 11px; letter-spacing: 1px; }
    #connecting {
      position: absolute; inset: 0; display: flex; align-items: center; justify-content: center;
      background: #04061a; z-index: 30; font-size: 14px; letter-spacing: 6px; color: var(--dim);
    }
    @media (max-width: 620px) {
      .mode-grid { grid-template-columns: repeat(2, 1fr); }
      #speed-plate .v { font-size: 32px; }
      #boost-wrap { width: 130px; }
      #chat-feed { width: 180px; }
    }
  </style>
</head>
<body>
  <div id="app">
    <div id="stage">
      <canvas id="game-canvas"></canvas>

      <!-- ===================== HUD ===================== -->
      <div id="hud" class="hidden">
        <div id="pos-plate" class="corner"><span class="p">1</span><span class="of">/ 8</span></div>
        <div id="clock-plate" class="corner"><div class="t">0:00.00</div><div class="gap"></div></div>
        <div id="speed-plate" class="corner"><div class="v">0</div><div class="u">KM/H</div></div>
        <div id="boost-wrap" class="corner">
          <div class="lbl">BOOST</div>
          <div id="boost-bar"><i></i></div>
        </div>
        <div id="standings" class="corner"></div>
        <div id="biome-banner" class="corner"></div>
        <div id="trick-text" class="corner"></div>
      </div>
      <div id="crash-flash"></div>
      <div id="nameplates"></div>
      <div id="countdown" class="hidden"></div>
      <div id="chat-feed"></div>
      <input id="chat-input" type="text" maxlength="120" placeholder="SAY SOMETHING…" />

      <!-- ===================== MENU ===================== -->
      <div id="menu" class="screen">
        <div id="account-chip"><div class="who">…</div></div>
        <div class="title">DIGITAL BIKE</div>
        <div class="sub">RACE THE MOUNTAIN DOWN</div>
        <div class="mode-grid">
          <button class="mode-btn" id="btn-freeride"><i class="mode-ico">🚵</i><span class="mode-name">FREE RIDE</span><span class="desc">Solo or against bots</span></button>
          <button class="mode-btn" id="btn-race"><i class="mode-ico">🏁</i><span class="mode-name">QUICK RACE</span><span class="desc">Up to 8 riders by code</span></button>
          <button class="mode-btn" id="btn-cup"><i class="mode-ico">🏆</i><span class="mode-name">CUP</span><span class="desc">Three hills, points, a champion</span></button>
          <button class="mode-btn" id="btn-join"><i class="mode-ico">🔑</i><span class="mode-name">JOIN</span><span class="desc">Enter a room code</span></button>
        </div>
        <div class="divider">PUBLIC ROOMS</div>
        <div id="lobby-list"></div>
        <div id="profile-card" class="panel hidden"></div>
      </div>

      <!-- ===================== SELECT ===================== -->
      <div id="select" class="screen hidden">
        <div class="panel-label" id="select-title">PICK YOUR RIDER</div>
        <div class="card-grid" id="char-grid"></div>
        <div class="divider">BIKE</div>
        <div class="card-grid" id="bike-grid"></div>
        <div class="divider" id="course-divider">HILL</div>
        <div class="card-grid" id="course-grid"></div>
        <div class="row">
          <button class="ghost" id="select-back">BACK</button>
          <button class="primary" id="select-go">GO</button>
        </div>
      </div>
      <canvas id="char-canvas" class="hidden"></canvas>

      <!-- ===================== WAITING / LOBBY ===================== -->
      <div id="waiting" class="screen hidden">
        <div class="panel-label" id="waiting-title">WAITING FOR RIDERS</div>
        <div class="code" id="waiting-code">—</div>
        <div class="row"><span class="info-pill" id="waiting-link">…</span><button class="ghost" id="copy-link">COPY LINK</button></div>
        <div class="row" id="waiting-info"></div>
        <div id="waiting-players"></div>
        <div class="row">
          <button class="ghost" id="waiting-leave">LEAVE</button>
          <button id="waiting-ready">READY UP</button>
          <button class="primary hidden" id="waiting-start">START</button>
        </div>
        <div class="row"><button class="ghost" id="waiting-settings">ROOM SETTINGS</button></div>
      </div>

      <!-- ===================== RESULTS ===================== -->
      <div id="results" class="screen hidden">
        <div class="title panel-label" id="results-title" style="font-size:22px;letter-spacing:8px">RESULTS</div>
        <div class="board" id="results-board"></div>
        <div id="reveal"></div>
        <div class="row">
          <button class="ghost" id="results-leave">BACK TO MENU</button>
          <button class="primary hidden" id="results-again">RIDE AGAIN</button>
        </div>
      </div>

      <!-- ===================== MODALS ===================== -->
      <div id="name-modal" class="modal hidden">
        <div class="panel">
          <div class="panel-label">WHAT DO THEY CALL YOU?</div>
          <input id="name-input" type="text" maxlength="16" placeholder="RIDER" />
          <button class="primary" id="name-confirm">LET'S RIDE</button>
          <div class="divider" id="name-or">OR</div>
          <button class="ghost" id="name-signin">I HAVE AN ACCOUNT</button>
          <div class="msg" id="name-note"></div>
        </div>
      </div>

      <div id="signin-modal" class="modal hidden">
        <div class="panel">
          <div class="panel-label" id="si-title">SIGN IN</div>
          <div class="msg" id="si-sub">Keep your progress on every device.</div>
          <input id="si-email" type="email" placeholder="EMAIL" />
          <input id="si-password" type="password" placeholder="PASSWORD" />
          <button class="primary" id="si-submit">SIGN IN</button>
          <div class="row">
            <button class="ghost" id="si-mode">CREATE ACCOUNT</button>
            <button class="ghost" id="si-forgot">RESET PASSWORD</button>
          </div>
          <div class="divider" id="si-or">OR</div>
          <button id="si-google">CONTINUE WITH GOOGLE</button>
          <div class="msg" id="si-msg"></div>
          <button class="ghost" id="si-close">CLOSE</button>
        </div>
      </div>

      <div id="rules-modal" class="modal hidden">
        <div class="panel">
          <div class="panel-label">ROOM SETTINGS</div>
          <div id="rules-body" style="width:100%;display:flex;flex-direction:column;gap:10px"></div>
          <button class="primary" id="rules-close">DONE</button>
        </div>
      </div>

      <div id="pause-modal" class="modal hidden">
        <div class="panel">
          <div class="panel-label">PAUSED</div>
          <div id="pause-room" style="width:100%;display:flex;flex-direction:column;gap:5px"></div>
          <button id="pause-resume">RESUME</button>
          <button class="ghost" id="pause-gfx">GRAPHICS</button>
          <button class="danger" id="pause-quit">QUIT THE RACE</button>
        </div>
      </div>

      <div id="graphics" class="panel hidden">
        <div class="panel-label">GRAPHICS</div>
        <div class="row" style="justify-content:flex-start;margin:8px 0">
          <button class="ghost" data-preset="low">LOW</button>
          <button class="ghost" data-preset="medium">MEDIUM</button>
          <button class="ghost" data-preset="high">HIGH</button>
        </div>
        <div id="gfx-rows"></div>
        <div class="stat-row" style="margin-top:10px"><span>FPS</span><b id="gfx-fps">—</b></div>
        <button class="ghost" id="gfx-close" style="margin-top:12px;width:100%">CLOSE</button>
      </div>

      <!-- ===================== TOUCH ===================== -->
      <div id="touch-controls">
        <div id="touch-stick-zone"><div id="touch-stick"><div id="touch-knob"></div></div></div>
        <div id="touch-actions">
          <button class="touch-btn boost" id="touch-boost">BOOST</button>
          <button class="touch-btn" id="touch-trick">TRICK</button>
          <button class="touch-btn hop" id="touch-hop">HOP</button>
        </div>
      </div>

      <div id="corner-btns">
        <button class="ghost" id="btn-gfx">⚙</button>
        <button class="ghost" id="btn-full">⛶</button>
      </div>
      <div id="toast"></div>
      <div id="connecting">CONNECTING TO SERVER…</div>
    </div>
  </div>
  <script type="module" src="/src/main.ts"></script>
</body>
</html>
